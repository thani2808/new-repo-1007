<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Text</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background-color: #f5f5f5;
    }
    .content {
      background: white;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Text Viewer</h1>
  <div class="content">
    Hello, this is a sample text.<br>
    You can view any static content here.<br>
    Line breaks, <b>bold text</b>, and other basic formatting work too!
  </div>
</body>
</html>
